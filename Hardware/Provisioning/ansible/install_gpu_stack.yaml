---
- name: Install GPU stack, drivers, tools, and dependencies on all nodes
  hosts: all
  become: yes
  tasks:

    - name: Install essential tools and dependencies
      apt:
        name:
          - sshpass
          - ipmitool
          - dos2unix
          - make
          - gcc
          - hwloc
          - numactl
          - net-tools
          - pv
          - nload
          - iftop
          - unzip
          - dkms
          - jq
          - nfs-common
          - openmpi-bin
          - cifs-utils
          - nmon
          - policycoreutils-python-utils
          - python3-pip
          - python3-matplotlib
          - stress-ng
          - fio
          - sysstat
          - nvme-cli
          - infiniband-diags
          - libibumad3
          - mstflint
          - powertop
        state: present
        update_cache: yes

    - name: Add NVIDIA CUDA repository
      shell: |
        distribution=$(. /etc/os-release; echo $ID$VERSION_ID | sed 's/\.//g')
        wget -q https://developer.download.nvidia.com/compute/cuda/repos/$distribution/x86_64/cuda-keyring_1.1-1_all.deb
        dpkg -i cuda-keyring_1.1-1_all.deb
        rm cuda-keyring_1.1-1_all.deb
      args:
        creates: /etc/apt/sources.list.d/cuda-*.list

    - name: Add Docker repository
      shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.asc
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
          > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Add NVIDIA Container Toolkit repository
      shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
        curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
          sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#' \
          > /etc/apt/sources.list.d/nvidia-container-toolkit.list
        sed -i '/experimental/s/^#//' /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install GPU stack, CUDA, and Docker
      apt:
        name:
          - nvidia-open
          - cuda-toolkit-13-1
          - nvlsm
          - nvidia-fabricmanager
          - datacenter-gpu-manager-4-cuda13
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - nvidia-container-toolkit
        state: present

    - name: Configure Docker for NVIDIA runtime
      command: nvidia-ctk runtime configure --runtime=docker
      notify: restart docker

    - name: Enable and start GPU-related services
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - nvidia-fabricmanager
        - nvidia-dcgm
        - docker

    - name: Add CUDA environment variables
      blockinfile:
        path: /etc/profile.d/cuda.sh
        create: yes
        marker: "# {mark} CUDA ENV"
        block: |
          export PATH=/usr/local/cuda-13.1/bin${PATH:+:${PATH}}
          export LD_LIBRARY_PATH=/usr/local/cuda-13.1/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}

    - name: Ensure ib_umad module loads at boot
      lineinfile:
        path: /etc/modules
        line: ib_umad
        create: yes

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted

